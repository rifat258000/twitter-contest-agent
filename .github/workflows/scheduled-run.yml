name: Scheduled contest scrape

on:
  schedule:
    # Every 30 minutes. GitHub cron can be delayed during peak load.
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (don't post to Telegram)"
        required: false
        default: "false"

permissions:
  contents: read

concurrency:
  group: contest-agent-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
      RAPIDAPI_HOST: twitter-api45.p.rapidapi.com
      DEDUP_DB_PATH: ./data/posted.db
      MAX_TWEETS_PER_QUERY: "20"
      MIN_ENGAGEMENT_SCORE: "30"
      TOP_N_PER_RUN: "3"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Restore dedup DB
        id: cache-dedup
        uses: actions/cache@v4
        with:
          path: data/posted.db
          key: dedup-db-${{ github.run_id }}
          restore-keys: |
            dedup-db-

      - name: Run agent
        run: |
          mkdir -p data
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            contest-agent run --dry-run -v
          else
            contest-agent run
          fi
