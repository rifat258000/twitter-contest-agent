<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0f17" />
  <title>X Comment AI — Generate engaging X replies in 1 click</title>

  <!-- Tailwind via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            // Refined dark palette — cooler near-black, single restrained accent.
            ink:    { 950: '#05060a', 900: '#0a0c12', 800: '#11141c', 700: '#181c27', 600: '#222837' },
            accent: { 300: '#6ab5ff', 400: '#3a9bff', 500: '#0a84ff', 600: '#0070e0', 700: '#0058b1' },
          },
          fontFamily: {
            // Native SF Pro on Apple devices → Inter elsewhere → system fallback.
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"SF Pro Text"', 'Inter', 'system-ui', 'sans-serif'],
          },
          letterSpacing: { tightest: '-0.035em' },
          boxShadow: {
            // Layered, Apple-style elevation.
            soft:  '0 1px 2px rgba(0,0,0,0.30), 0 0 0 1px rgba(255,255,255,0.04) inset',
            card:  '0 8px 24px -8px rgba(0,0,0,0.55), 0 2px 6px -2px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.06) inset',
            lift:  '0 24px 48px -16px rgba(0,0,0,0.65), 0 8px 16px -8px rgba(0,0,0,0.45), 0 0 0 1px rgba(255,255,255,0.06) inset',
            ring:  '0 0 0 4px rgba(10, 132, 255, 0.18)',
            press: 'inset 0 1px 0 rgba(255,255,255,0.10)',
          },
          transitionTimingFunction: {
            // iOS spring-feel ease.
            ios: 'cubic-bezier(0.32, 0.72, 0, 1)',
          },
        },
      },
    };
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/static/style.css" />
  <script defer src="/static/app.js"></script>
</head>

<body class="min-h-screen bg-ink-950 text-slate-100 font-sans antialiased tracking-tight selection:bg-accent-500/30 selection:text-white">

  <!-- Animated gradient blobs -->
  <div aria-hidden="true" class="pointer-events-none fixed inset-0 -z-10 overflow-hidden">
    <div class="blob blob-a"></div>
    <div class="blob blob-b"></div>
    <div class="blob blob-c"></div>
  </div>

  <main class="mx-auto max-w-3xl px-5 sm:px-6 py-14 sm:py-20">

    <!-- Header -->
    <header class="text-center mb-12 sm:mb-16">
      <div class="inline-flex items-center gap-2 rounded-full border border-white/10 bg-white/[0.04] px-3 py-1 text-[11px] text-slate-300 backdrop-blur-xl">
        <span class="relative flex h-1.5 w-1.5">
          <span class="absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-60 animate-ping"></span>
          <span class="relative inline-flex h-1.5 w-1.5 rounded-full bg-emerald-400"></span>
        </span>
        <span class="tracking-wide">Powered by Groq · Llama 3.3</span>
      </div>
      <h1 class="mt-6 text-[44px] sm:text-6xl font-bold tracking-tightest leading-[1.05]">
        <span class="bg-gradient-to-b from-white via-white to-slate-400 bg-clip-text text-transparent">
          X Comment AI
        </span>
      </h1>
      <p class="mt-4 text-slate-400 text-[15px] sm:text-lg max-w-xl mx-auto leading-relaxed">
        Paste any number of X post links — get tailored, on-brand replies in one click.
      </p>
    </header>

    <!-- Input card -->
    <section class="glass rounded-3xl p-6 sm:p-8 shadow-card">
      <form id="generate-form" class="space-y-5" novalidate>
        <div class="flex items-center justify-between">
          <label for="urls" class="block text-[13px] font-medium text-slate-200">X post URLs <span class="text-slate-500 font-normal">· one per line</span></label>
          <span id="url-count" class="text-[11px] tabular-nums text-slate-500">0 URLs</span>
        </div>
        <textarea
          id="urls" name="urls" required autocomplete="off" spellcheck="false" rows="6"
          placeholder="https://x.com/username/status/1234567890&#10;https://x.com/another/status/9876543210&#10;Paste any number of X post URLs…"
          class="w-full rounded-2xl bg-ink-800/70 border border-white/10 px-4 py-3.5 text-slate-100 placeholder:text-slate-500 outline-none focus:border-accent-500/60 focus:shadow-ring transition-all duration-200 ease-ios font-mono text-[13px] leading-relaxed resize-y"
        ></textarea>

        <!-- Selectors row -->
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
          <div>
            <label for="lang" class="block text-[10.5px] uppercase tracking-[0.12em] text-slate-500 mb-1.5">Language</label>
            <select id="lang" class="select-ios">
              <option value="auto">Auto</option>
              <option value="en">English</option>
              <option value="bn">Bengali</option>
            </select>
          </div>

          <div>
            <label for="tone" class="block text-[10.5px] uppercase tracking-[0.12em] text-slate-500 mb-1.5">Tone</label>
            <select id="tone" class="select-ios">
              {% for t in tones %}
              <option value="{{ t }}" {% if t == "witty" %}selected{% endif %}>{{ t|capitalize }}</option>
              {% endfor %}
            </select>
          </div>

          <div>
            <label for="length" class="block text-[10.5px] uppercase tracking-[0.12em] text-slate-500 mb-1.5">Length</label>
            <select id="length" class="select-ios">
              {% for l in lengths %}
              <option value="{{ l }}" {% if l == "medium" %}selected{% endif %}>{{ l|capitalize }}</option>
              {% endfor %}
            </select>
          </div>

          <div class="col-span-2 sm:col-span-1">
            <label for="variants" class="block text-[10.5px] uppercase tracking-[0.12em] text-slate-500 mb-1.5" title="Lower = uses less Groq quota per post">Variants</label>
            <select id="variants" class="select-ios">
              <option value="1">1 (least quota)</option>
              <option value="2" selected>2 (balanced)</option>
              <option value="3">3 (most variety)</option>
            </select>
          </div>
        </div>

        <button
          id="submit-btn" type="submit"
          class="btn-primary group relative w-full inline-flex items-center justify-center gap-2 rounded-2xl px-5 py-3.5 text-[15px] font-semibold text-white"
        >
          <span id="btn-label" class="inline-flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-[18px] w-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="m12 3 1.9 5.8L20 11l-5.8 1.9L12 19l-1.9-6.1L4 11l6.1-2.2z"/>
            </svg>
            <span id="btn-label-text">Generate Comments</span>
          </span>
          <span id="btn-spinner" class="hidden items-center gap-2">
            <span class="spinner"></span>
            Generating…
          </span>
        </button>
      </form>

      <div id="error-box" class="hidden mt-4 rounded-2xl border border-rose-500/30 bg-rose-500/[0.08] px-4 py-3 text-[13px] text-rose-200">
        <span id="error-text"></span>
      </div>
    </section>

    <!-- Results -->
    <section id="results" class="hidden mt-10 space-y-6">
      <!-- Bulk progress bar -->
      <div id="progress-wrap" class="hidden glass rounded-2xl p-4">
        <div class="flex items-center justify-between text-[13px] text-slate-300 mb-2.5">
          <span class="font-medium tabular-nums"><span id="progress-done">0</span> / <span id="progress-total">0</span> posts</span>
          <span id="progress-stats" class="text-[11px] text-slate-500 tabular-nums"></span>
        </div>
        <div class="h-1 w-full rounded-full bg-white/[0.06] overflow-hidden">
          <div id="progress-fill" class="h-full bg-gradient-to-r from-accent-400 to-accent-500 transition-all duration-500 ease-ios" style="width: 0%"></div>
        </div>
      </div>

      <!-- Failed-links summary (populated as failures happen) -->
      <details id="failed-wrap" class="hidden glass rounded-2xl p-4 border-rose-500/25 bg-rose-950/20" open>
        <summary class="flex items-center justify-between gap-3 cursor-pointer select-none">
          <span class="flex items-center gap-2 text-[13px] text-rose-200">
            <span class="inline-block h-1.5 w-1.5 rounded-full bg-rose-400"></span>
            <span class="font-medium"><span id="failed-count">0</span> link<span id="failed-plural">s</span> failed</span>
          </span>
          <span class="flex items-center gap-2">
            <button type="button" id="failed-retry"
              class="btn-pill btn-pill-emerald inline-flex items-center gap-1.5 px-3 py-1.5 text-[11.5px] disabled:opacity-50 disabled:cursor-not-allowed">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/>
              </svg>
              <span id="failed-retry-label">Retry all failed</span>
            </button>
            <button type="button" id="failed-copy"
              class="btn-pill btn-pill-rose inline-flex items-center gap-1.5 px-3 py-1.5 text-[11.5px]">
              Copy URLs
            </button>
          </span>
        </summary>
        <ul id="failed-list" class="mt-3 space-y-2"></ul>
      </details>

      <!-- One post block per URL, populated by JS -->
      <div id="posts-list" class="space-y-5"></div>
    </section>

    <!-- History (sibling of #results so it's reachable on first page load) -->
    <section id="history-wrap" class="hidden mt-10">
      <header class="flex items-center justify-between mb-3 px-1">
        <h3 class="text-[10.5px] font-semibold uppercase tracking-[0.14em] text-slate-500">Recent</h3>
        <button id="history-clear" class="text-[11px] text-slate-500 hover:text-rose-300 transition-colors">Clear</button>
      </header>
      <ul id="history-list" class="space-y-2"></ul>
    </section>

    <footer class="mt-16 text-center text-[11px] text-slate-600">
      <span>FastAPI · twscrape · Groq</span>
      <span class="mx-2 text-slate-700">·</span>
      <span>Use responsibly</span>
    </footer>
  </main>

  <!-- Post block template: one per URL submitted -->
  <template id="post-template">
    <section class="post-block glass rounded-3xl p-5 sm:p-7 space-y-5 shadow-card">
      <!-- Original post header -->
      <article>
        <header class="flex items-center justify-between gap-3 mb-3">
          <div class="flex items-center gap-3 min-w-0">
            <div class="h-10 w-10 shrink-0 rounded-full bg-gradient-to-br from-accent-400 to-accent-600 ring-1 ring-white/10"></div>
            <div class="min-w-0">
              <p class="post-author-name font-semibold truncate text-[15px]"></p>
              <p class="post-author-handle text-[13px] text-slate-500 truncate"></p>
            </div>
          </div>
          <a class="post-link text-[12.5px] text-accent-400 hover:text-accent-300 transition-colors flex items-center gap-1"
             href="#" target="_blank" rel="noopener noreferrer">
            View on X
            <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7"/><path d="M7 7h10v10"/></svg>
          </a>
        </header>
        <p class="post-text whitespace-pre-wrap text-slate-200 leading-relaxed text-[15px]"></p>
      </article>

      <!-- Status row: pending / loading / error / done -->
      <div class="post-status flex items-center justify-between gap-3 border-t border-white/[0.06] pt-4">
        <div class="flex items-center gap-2 text-[13px] min-w-0">
          <span class="post-status-icon shrink-0"></span>
          <span class="post-status-text text-slate-400 truncate"></span>
        </div>
        <button type="button"
          class="post-regen-btn btn-ghost hidden inline-flex items-center gap-1.5 px-3 py-1.5 text-[12.5px] disabled:opacity-50 disabled:cursor-not-allowed">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/>
          </svg>
          <span class="post-regen-label">Regenerate</span>
        </button>
      </div>

      <!-- Variants for this post -->
      <div class="post-variants grid grid-cols-1 gap-3"></div>
    </section>
  </template>

  <!-- Variant template (cloned by JS) -->
  <template id="variant-template">
    <article class="variant rounded-2xl border border-white/[0.07] bg-ink-800/60 backdrop-blur-xl p-5 sm:p-6 shadow-soft hover:border-white/[0.12] transition-colors">
      <header class="flex items-center justify-between mb-3">
        <span class="variant-badge text-[10.5px] font-semibold uppercase tracking-[0.12em] text-accent-400">Variant</span>
        <span class="variant-counter text-[11px] tabular-nums text-slate-500">0 / 280</span>
      </header>

      <div class="variant-text whitespace-pre-wrap text-slate-100 text-[17px] leading-relaxed outline-none focus:bg-ink-700/40 rounded-lg p-2 -mx-1 transition-colors"
           contenteditable="true" spellcheck="true"></div>

      <div class="mt-4 flex flex-wrap items-center gap-2">
        <button class="copy-btn btn-ghost inline-flex items-center gap-1.5 px-3 py-1.5 text-[12.5px]">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
          </svg>
          <span class="copy-label">Copy</span>
        </button>

        <a class="reply-btn btn-pill btn-pill-accent inline-flex items-center gap-1.5 px-3 py-1.5 text-[12.5px]"
           href="#" target="_blank" rel="noopener noreferrer">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>
          </svg>
          Reply on X
        </a>

        <span class="ml-auto text-[11px] text-slate-500">Edit before posting</span>
      </div>
    </article>
  </template>

  <!-- Toast -->
  <div id="toast" class="toast fixed bottom-8 left-1/2 -translate-x-1/2 hidden rounded-full bg-ink-700/95 backdrop-blur-xl border border-white/10 px-4 py-2 text-[13px] font-medium text-white shadow-lift">
    Copied to clipboard
  </div>
</body>
</html>
