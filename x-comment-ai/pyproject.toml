[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "x-comment-ai"
version = "1.0.0"
description = "FastAPI + Groq + twscrape app that generates engaging X (Twitter) replies."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Rifat", email = "rifathasanm24@gmail.com" },
]
license = { text = "MIT" }
keywords = ["x", "twitter", "groq", "llama", "fastapi", "twscrape"]

dependencies = [
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
    "jinja2==3.1.4",
    "python-multipart==0.0.17",
    "python-dotenv==1.0.1",
    "pydantic==2.9.2",
    "pydantic-settings==2.6.1",
    "groq==0.13.0",
    "twscrape==0.17.0",
    "httpx==0.27.2",
    "anyio==4.6.2.post1",
    "loguru==0.7.2",
]

[tool.setuptools]
packages = ["app"]
include-package-data = true

[tool.setuptools.package-data]
app = []
