# Fly.io config for RIFAT < AI (rifat-ai.fly.dev)
# Generated by Devin on 2026-04-29.

app = "rifat-ai"
primary_region = "iad"
kill_signal = "SIGINT"
kill_timeout = "5s"

[build]

[env]
  PORT = "8080"
  TWSCRAPE_DB_PATH = "/data/accounts.db"
  GROQ_MODEL = "llama-3.3-70b-versatile"

# Persistent volume for the twscrape SQLite DB so cookies survive restarts
# and we don't burn the per-15-min X login budget on every cold start.
[mounts]
  source = "rifat_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Auto-stop after idle to stay on the free tier; auto-start on first request.
  # Cold start is ~2-3s on Fly because the container is snapshotted, not
  # rebooted from scratch (vs Render's 30-60s).
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
