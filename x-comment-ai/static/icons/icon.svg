<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0c12"/>
      <stop offset="1" stop-color="#05060a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a9bff"/>
      <stop offset="1" stop-color="#0a84ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.25" r="0.7">
      <stop offset="0" stop-color="#0a84ff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#0a84ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- Rounded square background with subtle iOS-blue radial glow -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#glow)"/>
  <rect x="2" y="2" width="508" height="508" rx="110" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Speech bubble (rounded square with notch) -->
  <g transform="translate(96 96)">
    <path d="M40 0 H280 a40 40 0 0 1 40 40 V210 a40 40 0 0 1 -40 40 H140 L72 308 L88 250 H40 a40 40 0 0 1 -40 -40 V40 a40 40 0 0 1 40 -40 z"
          fill="url(#accent)"/>
    <!-- subtle inner highlight -->
    <path d="M40 0 H280 a40 40 0 0 1 40 40 V46 H0 V40 a40 40 0 0 1 40 -40 z"
          fill="rgba(255,255,255,0.18)"/>
  </g>

  <!-- "X" glyph centered in bubble -->
  <g transform="translate(196 200)" stroke="white" stroke-width="22" stroke-linecap="round">
    <line x1="0"   y1="0"   x2="120" y2="120"/>
    <line x1="120" y1="0"   x2="0"   y2="120"/>
  </g>

  <!-- Sparkle accent (top-right) -->
  <g transform="translate(372 96)" fill="white">
    <path d="M24 0 L29 19 L48 24 L29 29 L24 48 L19 29 L0 24 L19 19 Z"/>
  </g>
  <g transform="translate(420 152)" fill="white" opacity="0.75">
    <path d="M14 0 L17 11 L28 14 L17 17 L14 28 L11 17 L0 14 L11 11 Z"/>
  </g>
</svg>
