<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0B0F1A" />
  <title>Offline — RIFAT &lt; AI</title>
  <link rel="apple-touch-icon" sizes="180x180" href="/static/icons/apple-touch-icon.png" />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%;
      background: #05060a;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', Inter, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    main {
      min-height: 100%; padding: 32px 20px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center;
    }
    .badge {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 6px 12px; border-radius: 9999px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.10);
      color: #94a3b8; font-size: 11px; letter-spacing: 0.04em;
    }
    .dot {
      width: 6px; height: 6px; border-radius: 9999px; background: #f87171;
    }
    h1 {
      margin: 24px 0 12px; font-size: 36px; font-weight: 700;
      letter-spacing: -0.035em; line-height: 1.1;
    }
    p { color: #94a3b8; max-width: 32ch; line-height: 1.6; font-size: 15px; }
    button {
      margin-top: 28px; padding: 12px 22px;
      border-radius: 14px; border: none; cursor: pointer;
      font: inherit; font-size: 15px; font-weight: 600;
      color: white;
      background: linear-gradient(180deg, #1b91ff, #0a84ff);
      box-shadow: 0 1px 0 rgba(255,255,255,0.18) inset, 0 10px 28px -8px rgba(10,132,255,0.55);
      transition: transform 200ms cubic-bezier(.32,.72,0,1);
    }
    button:active { transform: scale(0.985); }
  </style>
</head>
<body>
  <main>
    <span class="badge"><span class="dot"></span> Offline</span>
    <h1>You're offline</h1>
    <p>RIFAT &lt; AI needs an internet connection to fetch posts and generate replies.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
